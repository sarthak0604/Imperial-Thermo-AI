<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMPER-ai-L</title>
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("fif-theme") === "light" ? "light" : "dark"; } catch (e) {}</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%227%22 fill=%22none%22 stroke=%22%234A7DFF%22 stroke-width=%222.4%22/%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%225.4%22 fill=%22none%22 stroke=%22%23FF8A1F%22 stroke-width=%221%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/backend.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="app" id="app">
    <aside class="side" id="side" aria-label="Sidebar">
      <div class="side-h">
        <a class="brand" href="#" data-home aria-label="IMPER-ai-L, new question"><span class="brand-mark" aria-hidden="true"></span><span class="brand-t">IMPER<span class="dash">-</span><i>ai</i><span class="dash">-</span>L</span></a>
        <button type="button" class="ib" data-side aria-label="Close sidebar" title="Close sidebar"></button>
      </div>
      <nav class="side-nav" aria-label="Main">
        <a class="si" href="#" data-home data-ic="edit">New question</a>
        <button type="button" class="si" data-search data-ic="search">Search questions</button>
        <label class="side-search" hidden><span class="visually-hidden">Search your questions</span><input type="search" id="hsearch" placeholder="Search your questions" autocomplete="off"></label>
        <a class="si" href="#questions" data-route="questions" data-ic="folder">All questions</a>
        <a class="si" href="#experiments" data-route="experiments" data-ic="beaker">NASA experiments</a>
        <a class="si" href="#display" data-route="display" data-ic="sliders">Data display settings</a>
      </nav>
      <div class="hist" id="hist"></div>
      <div class="side-f">
        <div class="team"><span class="team-mk" aria-hidden="true"></span><span><span class="team-w" role="img" aria-label="dynamICs"></span><small>Flame in Freefall · NASA Space Apps 2026</small></span></div>
        <p class="ai-status" id="ai-status"><i></i><span>Checking the AI…</span></p>
      </div>
    </aside>
    <div class="side-scrim" data-side-close></div>

    <div class="mainc">
      <header class="top" id="top">
        <button type="button" class="ib sopen" data-side aria-label="Open sidebar" title="Open sidebar"></button>
        <span class="sp"></span>
        <div class="acts-top" id="acts-top" hidden>
          <div class="pop" id="share-pop"></div>
          <button type="button" class="btn s sm" data-pdf data-ic="download">PDF</button>
        </div>
        <button type="button" class="mode" id="mode" role="switch" aria-checked="true" aria-label="Dark mode" title="Light or dark"></button>
      </header>

      <main id="view">
        <section id="home" class="home" aria-label="Ask">
          <div class="flame-stage" aria-hidden="true"><canvas id="flame"></canvas></div>
          <p class="env-cap" id="env-cap" aria-live="polite"></p>
          <div id="home-slot" class="slot"></div>
        </section>
        <section id="answer" class="answer-view" hidden></section>
        <section id="page" class="page-view" hidden></section>
      </main>

      <div class="dock" id="dock" hidden><div class="slot"><div id="qtab-slot"></div><div id="dock-slot"></div></div></div>
    </div>
  </div>

  <form id="ask-form" class="pb" novalidate>
    <label class="visually-hidden" for="q">Ask a question</label>
    <textarea id="q" name="q" rows="1" placeholder="Ask about any flame in microgravity" autocomplete="off"></textarea>
    <div class="pop pb-env" id="env-pop"></div>
    <span class="kbd-hint" aria-hidden="true">Enter to ask · Shift+Enter for a new line</span>
    <div class="dd pb-per" id="persona-dd"></div>
    <button type="submit" class="send" aria-label="Ask" title="Ask"></button>
  </form>

  <div id="focus" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- data -->
  <script src="data/reference.js"></script>
  <script src="data/investigations.js"></script>
  <script src="data/models.js"></script>
  <script src="data/knowledge.js"></script>
  <script src="data/project.js"></script>
  <!-- charts and widgets -->
  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/logo.js"></script>
  <script src="data/model_outputs.js"></script>
  <script src="data/literature.js"></script>
  <script src="js/model_widgets.js"></script>
  <script src="js/model_widgets_more.js"></script>
  <script src="js/model_widgets_liem.js"></script>
  <script src="js/figures.js"></script>
  <script src="js/pipeline.js"></script>
  <script src="js/text_widgets.js"></script>
  <script src="js/library.js"></script>
  <script src="js/tiler.js"></script>
  <script src="js/story.js"></script>
  <!-- interface -->
  <script src="js/ui.js"></script>
  <script src="js/bg.js"></script>
  <script src="js/flame.js"></script>
  <script src="js/workflow.js"></script>
  <script src="js/answer.js"></script>
  <script src="js/expand.js"></script>
  <script src="js/report.js"></script>
  <script src="js/fm.js"></script>
  <script src="js/manage.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
