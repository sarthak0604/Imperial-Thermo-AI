[project]
name = "imperial-thermo-ai"
version = "0.1.0"
description = "Thermo AI workloads and validated graph-search service requests"
readme = "README.md"
authors = [
    { name = "Liem-Fairbairn", email = "lf725@ic.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "numpy>=2",
    "pydantic>=2.10,<3",
    "scipy>=1.14",
    "openai>=2,<3",
]

[project.optional-dependencies]
plotting = ["matplotlib>=3.9,<4"]
search = ["accelerate>=1.15.0", "torch>=2.15.0", "transformers>=5.23.0"]

[project.scripts]
main = "imperial_thermo_ai.main:main"
google = "imperial_thermo_ai.cloud:main"
imperial-thermo-ai = "imperial_thermo_ai.main:main"
thermo-plan = "request_planner.__main__:main"
thermo-search = "request_planner.mini_graph:main"
thermo-plot = "request_planner.plotting:main"
thermo-execute = "request_planner.service:main"
thermo-evaluate = "imperial_thermo_ai.evaluation:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["imperial_thermo_ai", "request_planner", "thermo_functions"]
package-dir = {imperial_thermo_ai = "src/imperial_thermo_ai", request_planner = "src/request_planner", thermo_functions = "src/Functions"}

[tool.setuptools.package-data]
imperial_thermo_ai = ["flat_prompt.txt"]
thermo_functions = ["*.json", "THM-*/*.py", "THM-*/*.json"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
]
