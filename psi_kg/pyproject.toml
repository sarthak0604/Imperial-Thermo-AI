[project]
name = "nasa-psi-knowledge-graph"
version = "0.1.0"
description = "Evidence-grounded single-investigation NASA PSI knowledge graphs"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "google-genai>=1.0",
  "jsonschema>=4.23",
  "openpyxl>=3.1",
  "pydantic>=2.10",
  "pypdf>=5",
  "fonttools>=4",
  "python-dotenv>=1",
  "numpy>=2",
  "h5py>=3",
  "scipy>=1.14",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
psi-setup-gemini = "psi_graph.setup_gemini:main"
psi-graph-manage = "psi_graph.manage:main"
psi-graph = "psi_graph.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["psi_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"psi_graph/nasa_access.py" = ["I"]
